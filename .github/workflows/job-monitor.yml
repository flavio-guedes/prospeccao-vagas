name: Job Intelligence Monitor
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/run_all.py
      - run: |
          git config user.name "hermes-bot"
          git config user.email "hermes-bot@users.noreply.github.com"
          git add data/scored_opportunities.json data/applications.json data/history.json data/sources.json || true
          git commit -m "chore(job-intelligence): update scored data" || true
          git push || true
